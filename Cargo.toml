[package]
name = "uibooks"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
csv = "1.4.0"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_meta = "0.8.6"
leptos_router = "0.8.14"
num-format = "0.4.4"
serde = { version = "1.0.228", features = ["derive"] }
thaw = { version = "0.5.0-beta", features = ["csr"] }
wasm-bindgen-futures = "0.4.76"

[dependencies.web-sys]
version = "0.3.103"
features = [
    "Blob",
    "File",
    "FileList",
    "HtmlInputElement"
]
